{% extends "base.html" %}

{% block title %}Add Eco Colour | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Add Eco Colour</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn btn-success">
            Create
        </button>

        <a href="{% url 'weapon_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
