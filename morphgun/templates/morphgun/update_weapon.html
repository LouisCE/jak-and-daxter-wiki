{% extends "base.html" %}

{% block title %}Edit {{ weapon.name }} | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Edit {{ weapon.name }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary">
            Update
        </button>

        <a href="{% url 'weapon_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
