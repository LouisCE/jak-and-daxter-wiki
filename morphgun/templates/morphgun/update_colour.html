{% extends "base.html" %}

{% block title %}Edit {{ colour.name }} | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Edit {{ colour.name }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>

<a href="{% url 'weapon_list' %}" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
