{% extends "base.html" %}
{% block title %}Rate Weapons | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Rate Morph Gun Weapons</h1>

<form method="post">
    {% csrf_token %}

    <table class="table">
        <thead>
            <tr>
                <th>Weapon</th>
                <th>Your Rating (1–10)</th>
            </tr>
        </thead>
        <tbody>
            {% for weapon in weapons %}
            <tr>
                <td>
                    {{ weapon.name }}
                    <span class="badge bg-secondary">{{ weapon.colour.name }}</span>
                </td>
                <td>
                    <select name="weapon_{{ weapon.id }}" class="form-select" required>
                        <option value="">—</option>
                        {% for i in range %}
                        <option value="{{ i }}" {% if weapon.user_score == i %} selected {% endif %}>
                            {{ i }}
                        </option>
                        {% endfor %}
                    </select>

                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <button type="submit" class="btn btn-primary">
        Save Ratings
    </button>
</form>
{% endblock %}
