{% extends "base.html" %}
{% block title %}Rate Weapons | Jak and Daxter Wiki{% endblock %}

{% block content %}
<div class="container mt-4">

    <!-- Rating Form -->
    <div class="card bg-dark text-light shadow-sm mb-4">
        <div class="card-body">
            <h1 class="mb-3">Rate Morph Gun Weapon Mods</h1>

            <form method="post">
                {% csrf_token %}

                <table class="table table-dark table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Weapon</th>
                            <th>Your Rating (1–10)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for weapon in weapons %}
                        <tr>
                            <td>{{ weapon.name }}</td>
                            <td>
                                <select
                                    name="weapon_{{ weapon.id }}"
                                    class="form-select"
                                    required
                                >
                                    <option value="">—</option>
                                    {% for i in range %}
                                    <option
                                        value="{{ i }}"
                                        {% if weapon.user_score == i %}selected{% endif %}
                                    >
                                        {{ i }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>

                <button type="submit" class="btn btn-primary">
                    Save Ratings
                </button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
