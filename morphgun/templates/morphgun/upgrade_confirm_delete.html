{% extends "base.html" %}

{% block title %}Delete Upgrade | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Delete Upgrade</h1>

<p>
    Are you sure you want to delete
    <strong>{{ upgrade.name }}</strong>?
</p>

<form method="POST" class="d-flex gap-2 mt-3">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Confirm Delete
    </button>

    <a href="{% url 'weapon_list' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>
{% endblock %}
