{% extends "base.html" %}

{% block title %}{{ title }} | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        {{ button_text }}
    </button>

    <a href="{% url 'weapon_list' %}" class="btn btn-secondary ms-2">
        Cancel
    </a>
</form>
{% endblock %}
