{% extends "base.html" %}

{% block title %}Delete {{ weapon.name }} | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Delete {{ weapon.name }}</h1>
<p>Are you sure you want to delete this weapon?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'weapon_detail' weapon.pk %}">Cancel</a>
</form>
{% endblock %}
