{% extends "base.html" %}

{% block title %}Delete {{ weapon.name }} | Jak and Daxter Wiki{% endblock %}

{% block content %}
<h1>Delete {{ weapon.name }}</h1>
<p>Are you sure you want to delete this weapon?</p>

<form method="POST" class="d-flex gap-2 mt-3">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Confirm Delete
    </button>

    <a href="{% url 'weapon_detail' weapon.pk %}" class="btn btn-secondary">
        Cancel
    </a>
</form>
{% endblock %}
