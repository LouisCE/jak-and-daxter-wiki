{% extends "base.html" %}
{% load static %}

{% block title %}Delete Character | Jak and Daxter Wiki{% endblock %}

{% block content %}
<div class="container my-5">
    <h1>Delete Character</h1>
    <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'character_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
